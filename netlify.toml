[build]
command = "npm run build:hosted"
publish = "hosted-web-dist"

[build.environment]
NODE_VERSION = "24"
VITE_FORGE_DEMO_REPOSITORY = "thevarsek/nanthai-edge-oss"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[functions."public-read"]
included_files = ["hosted-web-dist/app.html"]

# "/" is the static public page (web/index.html): Netlify serves the file before any redirect. Every other page route
# is the signed-in app, web/app.html.

# Security headers for every page (review S-13). Frame protection, MIME sniffing, referrer rules and the
# full Content-Security-Policy are enforced. A signed-in smoke test of the dev site with this policy enforced
# showed no violations once Zod runs jitless (web/src/zod-jitless.ts). The inline script hashes must match the one
# inline script in web/app.html (the app's theme) and in web/index.html (the public page's theme and signed-in
# redirect); tests/web-headers.test.mjs checks both.
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Strict-Transport-Security = "max-age=31536000"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ex8kSqwf1WiPVL0BhnAXX54XDAjFXEHkC+qlMJg0x4Q=' 'sha256-/bpm5bmsSEb1V97OjNCSeP/6USgbOt6CwVT1lPKPzK4=' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://*.clerk.accounts.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://challenges.cloudflare.com https://*.clerk.accounts.dev; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# The app was served under "/-" until the switch to the root (Item b0704959). Mails, CLI output, board text and GitHub
# statuses carry those links, so "/-" and every "/-/*" address move for good (301, kept forever) to the same address
# without "/-". The cached public read answers them (netlify/functions/public-read.mts, config.path "/-/*"): a
# function's own path is served before these rules, it keeps /-/public/v1/ as data, and its Location is always this
# site. A "/:splat" rule here would send "/-//evil.example" to "//evil.example", another site. Old addresses of the
# earlier screens (/projects, /settings, ?project=<id>) need the app's resolver (web/src/app/old-address.ts), which
# runs before the app renders.
[[redirects]]
from = "/*"
to = "/app.html"
status = 200
