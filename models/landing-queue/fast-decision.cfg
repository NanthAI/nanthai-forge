  N = 3
  Cohort <- OneCohort
  Width = 6
  CrashBound = 0
  MoveBound = 0
  AllowCancel = FALSE
  AllowAdvice = FALSE
  PreQueue = TRUE
  Red = {}
  Independent = {1}
  LaneInfra = FALSE
  SuffixWaits = FALSE
  AllowReuse = TRUE
  Isolation = FALSE
  Hold = "early"
  Breaks = {}
  Fast = TRUE
  Relaxed = {2, 3}
  EarnAfter = 1
  StaleAfter = 1
  Earned0 = TRUE
  Stalls = 1
  FreshAt = "decision"
SPECIFICATION Spec
INVARIANTS UniqueRanks UniqueReservations Membership TrainSound NoStackOnSuspect TypeOK S1 S3 Reasons AuthorizedEvidence KnownRedNeverQueued LaneRunsBounded RedNeverQueued NoEarlyCohort NoLostWork NoBlindRevert FastSound LostOnRed
