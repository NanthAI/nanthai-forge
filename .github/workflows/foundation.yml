name: Verify Forge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - id: classify
        run: node scripts/ci-scope.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  foundation:
    needs: scope
    if: needs.scope.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: npm run check
      - run: node scripts/check-documents.mjs

  verify-static:
    needs: scope
    outputs:
      browser_shard: ${{ steps.plan.outputs.browser_shard }}
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - id: plan
        name: Plan shards, typecheck, lint and build
        run: node scripts/public-verify.mjs static 8
      # Preserve executable modes when sharing the exact builds with test jobs.
      - run: tar -czf "$RUNNER_TEMP/verify-build.tgz" dist hosted-web-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-build-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/verify-build.tgz
            ${{ runner.temp }}/public-verify-plan.json
          if-no-files-found: error

  verify-tests:
    needs: [scope, verify-static]
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1']
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verify-build-${{ matrix.node }}
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/verify-build.tgz"
      - if: needs.verify-static.outputs.browser_shard != '' && matrix.shard == needs.verify-static.outputs.browser_shard
        id: browser-version
        run: node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package-lock.json")).packages["node_modules/playwright"].version; if(!/^\d+\.\d+\.\d+$/.test(v)) throw Error("Expected pinned Playwright version"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\n`);'
      - if: needs.verify-static.outputs.browser_shard != '' && matrix.shard == needs.verify-static.outputs.browser_shard
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/forge-browsers
          key: forge-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-version.outputs.version }}
      - if: needs.verify-static.outputs.browser_shard != '' && matrix.shard == needs.verify-static.outputs.browser_shard && steps.browser-cache.outputs.cache-hit != 'true'
        run: node scripts/control-browser-cache.mjs
        env:
          FORGE_BROWSER_VERSION: ${{ steps.browser-version.outputs.version }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/forge-browsers
      - if: needs.verify-static.outputs.browser_shard != '' && matrix.shard == needs.verify-static.outputs.browser_shard && steps.browser-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/forge-browsers
          key: forge-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-version.outputs.version }}
      - run: node scripts/public-verify.mjs ${{ matrix.shard }} 8
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/forge-browsers

  native-selfhost:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: node scripts/selfhost-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORGE_NATIVE_GITHUB_OIDC: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
          FORGE_NATIVE_TARGET_RELEASE: precompiled-2026-10-01-d2ca853

  verify:
    needs: [scope, foundation, verify-static, verify-tests, native-selfhost]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected verification job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const required = needs.scope.outputs.scope === 'docs'
            ? ['scope', 'foundation']
            : ['scope', 'verify-static', 'verify-tests', 'native-selfhost'];
          const failed = Object.values(needs).some(job => !['success', 'skipped'].includes(job.result))
            || required.some(name => needs[name]?.result !== 'success');
          console.log(Object.entries(needs).map(([name, job]) => `${name}: ${job.result}`).join('\n'));
          process.exitCode = failed ? 1 : 0;
          JS
