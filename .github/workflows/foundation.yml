name: Verify Forge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: classify
        run: node scripts/ci-scope.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  foundation:
    needs: scope
    if: needs.scope.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: node scripts/check-documents.mjs

  verify:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run smoke:package

  native-selfhost:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: node scripts/selfhost-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORGE_NATIVE_GITHUB_OIDC: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
          FORGE_NATIVE_TARGET_RELEASE: precompiled-2026-10-01-d2ca853
