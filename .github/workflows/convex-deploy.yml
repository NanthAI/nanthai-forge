name: Deploy dev Convex
run-name: Deploy dev Convex ${{ inputs.sequence || github.event_name }}

# Starts from Forge main landings via workflow_dispatch (Item 8b6efb50), not from the GitHub mirror
# push. Checks out Forge main's exact State from R2 so deploys keep running even while the mirror is
# behind or paused. The 3-hour schedule run stays only as disaster catch-up (read-only plan query).
on:
  workflow_dispatch:
    inputs:
      state:
        description: Forge State that triggered the deploy (empty deploys Forge main's newest)
        required: false
        type: string
      sequence:
        description: Main sequence number Forge reported (shown only; the server decides)
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  id-token: write

# One dev deploy at a time; a newer landing replaces a queued run, never interrupts one mid-deploy.
concurrency:
  group: convex-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.FORGE_RELEASE_PROJECT != ''
    runs-on: ubuntu-latest
    # The dev deploy key lives only in this environment; it deploys from main alone, so forks and PRs never see it.
    environment: convex-dev
    timeout-minutes: 15
    env:
      FORGE_CONVEX_SITE: ${{ vars.VITE_CONVEX_SITE_URL }}
      FORGE_PROJECT_ID: ${{ vars.FORGE_RELEASE_PROJECT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Plan the deploy
        id: plan
        # Read-only query against Forge main (or 404 bootstrap fallback on first deploy of /deploy/actions).
        run: node scripts/forge-deploy-ci.mjs plan --target convex
      - name: Check out Forge main State
        if: steps.plan.outputs.deploy == 'true' && steps.plan.outputs.head != ''
        env:
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
        run: node scripts/forge-deploy-ci.mjs checkout --target convex --state "$DEPLOY_HEAD" --sequence "$DEPLOY_SEQUENCE" --dir .
      - if: steps.plan.outputs.deploy == 'true'
        run: npm ci --ignore-scripts
      - name: Deploy functions and schema to dev
        id: push
        if: steps.plan.outputs.deploy == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx --no-install convex deploy --typecheck enable --allow-deleting-large-indexes
      - name: Report deploy outcome to Forge
        if: always() && steps.plan.outputs.deploy == 'true' && steps.plan.outputs.head != ''
        env:
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUSH_OUTCOME" = "success" ]; then
            node scripts/forge-deploy-ci.mjs report \
              --target convex \
              --state "$DEPLOY_HEAD" \
              --sequence "$DEPLOY_SEQUENCE" \
              --status succeeded \
              --url "$RUN_URL"
          else
            node scripts/forge-deploy-ci.mjs report \
              --target convex \
              --state "$DEPLOY_HEAD" \
              --sequence "$DEPLOY_SEQUENCE" \
              --status failed \
              --url "$RUN_URL" \
              --summary "Dev Convex deploy failed (see workflow run)."
          fi
