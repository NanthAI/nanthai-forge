name: Sign CLI release
run-name: Sign CLI release ${{ inputs.release || github.sha }}

# Automated signer for Forge CLI releases (docs/operations/cli-update.md, "Automated signer").
# One job per signing on a GitHub-hosted runner; the release key exists only in the
# `release-sign` environment, which deploys from main alone. Forge dispatches it straight after
# each main landing with the new Forge State, so signing never waits on the GitHub mirror push.
# Whatever State a run starts from, it signs Forge main's newest State; a manual run without one
# starts from the Forge-State trailer of GitHub's main.
on:
  workflow_dispatch:
    inputs:
      state:
        description: Forge State to start from (empty uses the Forge-State trailer of GitHub's main)
        required: false
        type: string
      release:
        description: Release number Forge reported for that State (shown only; the server decides)
        required: false
        type: string

permissions:
  contents: read

# One signer at a time; a newer dispatch replaces a queued run, never interrupts a running one. A
# run whose State a newer main has passed signs that newest State instead, so a burst of landings
# signs only the newest State, whatever order the dispatches arrived in.
concurrency:
  group: release-sign
  cancel-in-progress: false

jobs:
  sign:
    # Off until the lead sets the repository variable (and with it the environment and its key).
    if: github.ref == 'refs/heads/main' && vars.FORGE_RELEASE_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-sign
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/release-sign-ci.mjs
            src/cli-release-keys.ts
            src/cli-release-statement.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Sign main's State
        # The key reaches this one step only, as an environment value the script deletes before it
        # runs anything else; it is never printed or written to disk.
        env:
          FORGE_RELEASE_URL: ${{ vars.FORGE_RELEASE_URL }}
          FORGE_RELEASE_PROJECT: ${{ vars.FORGE_RELEASE_PROJECT }}
          FORGE_RELEASE_STATE: ${{ inputs.state }}
          FORGE_RELEASE_SIGNING_KEY: ${{ secrets.FORGE_RELEASE_SIGNING_KEY }}
        run: node scripts/release-sign-ci.mjs
