name: Forge check
run-name: forge-check/${{ inputs.runId }}
on:
  workflow_dispatch:
    inputs:
      runId:
        required: true
        type: string
      plan:
        default: '[]'
        required: false
        type: string
      runs_on:
        description: JSON runner label or label array for hosted jobs
        required: false
        default: '"ubuntu-latest"'
        type: string
      deployment:
        description: Convex site URL for the hosted App/OIDC path
        required: false
        default: ''
        type: string
      projectId:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  shard:
    if: ${{ inputs.deployment == '' && inputs.plan != '[]' }}
    name: forge-shard-${{ matrix.shard }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.plan) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/forge-check.mjs
        env:
          FORGE_ACTIONS_PLAN: .github/forge-check-plan.json
          FORGE_ACTIONS_SHARD: ${{ matrix.shard }}
  static:
    if: ${{ inputs.deployment == '' }}
    name: forge-static
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/forge-check.mjs
        env:
          FORGE_ACTIONS_PLAN: .github/forge-check-plan.json
          FORGE_ACTIONS_SHARD: static

  hosted-plan:
    if: ${{ inputs.deployment != '' }}
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    # Preserve the previous plan (30 min) plus execution (90 min) allowance.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pack_refresh: ${{ steps.plan.outputs.pack_refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      # Save only trusted control dependencies; Candidate source/results are never cached.
      # Key from the pinned control lockfile only (scripts/control-deps-key.mjs; any CI computes it).
      - id: deps-key
        run: echo "key=$(node scripts/control-deps-key.mjs)" >> "$GITHUB_OUTPUT"
        working-directory: control
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: deps
        with:
          path: |
            control/node_modules
            ~/.npm
          key: ${{ steps.deps-key.outputs.key }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
        working-directory: control
      # Content hash of the lockfile and every file the build reads (any CI can run this script).
      - id: build-key
        run: echo "hash=$(node scripts/control-build-key.mjs)" >> "$GITHUB_OUTPUT"
        working-directory: control
      # Exact build inputs only. Never restore a prefix or save after Candidate execution.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: control-build
        with:
          path: control/dist
          key: forge-control-dist-v2-${{ runner.os }}-${{ runner.arch }}-node-24.22.1-${{ steps.build-key.outputs.hash }}
      - if: steps.control-build.outputs.cache-hit != 'true'
        run: npm run build:core
        working-directory: control
      - if: steps.control-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: control/dist
          key: forge-control-dist-v2-${{ runner.os }}-${{ runner.arch }}-node-24.22.1-${{ steps.build-key.outputs.hash }}
      # Candidate code shares this runner: save trusted dependencies before it executes,
      # never with an automatic post-job cache save after project code has run.
      # Only the default branch seeds the cache, so every other ref restores a main-seeded entry.
      - if: steps.deps.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            control/node_modules
            ~/.npm
          key: ${{ steps.deps-key.outputs.key }}
      - id: plan
        timeout-minutes: 30
        run: node control/scripts/hosted-actions-job.mjs plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORGE_CONVEX_SITE: ${{ inputs.deployment }}
          FORGE_PROJECT_ID: ${{ inputs.projectId }}
          FORGE_RUN_ID: ${{ inputs.runId }}
          FORGE_CANDIDATE: ${{ runner.temp }}/candidate
          # NanthAI is on the GitHub Team plan: 60 concurrent jobs. Other pipelines set
          # their own limit; unset keeps the Free-plan 20.
          FORGE_ACTIONS_JOB_CAP: '60'
          # Shard pool (work stealing, docs/operations/github-actions-checks.md#shard-pool):
          # on | off | ab. ab runs the pool on half the checks (random run id) for the
          # interleaved before/after measurement; set on once it is measured.
          FORGE_ACTIONS_POOL_MODE: 'ab'
      # Only distributed executions and the optional pack refresh need artifacts.
      - if: steps.plan.outputs.matrix != '[]' || steps.plan.outputs.pack_refresh == 'true'
        run: tar -cf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP" candidate forge-actions-plan.json forge-actions-run.json forge-pack-refresh.json forge-actions-state.json
      - if: steps.plan.outputs.matrix != '[]' || steps.plan.outputs.pack_refresh == 'true'
        run: tar -cf "$RUNNER_TEMP/control-dist.tar" -C control dist
      - if: steps.plan.outputs.matrix != '[]' || steps.plan.outputs.pack_refresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forge-candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate.tar
            ${{ runner.temp }}/control-dist.tar
      - if: steps.plan.outputs.single_shard != ''
        timeout-minutes: 90
        run: node control/scripts/hosted-actions-job.mjs run
        env:
          FORGE_CONVEX_SITE: ${{ inputs.deployment }}
          FORGE_PROJECT_ID: ${{ inputs.projectId }}
          FORGE_RUN_ID: ${{ inputs.runId }}
          FORGE_CANDIDATE: ${{ runner.temp }}/candidate
          FORGE_ACTIONS_SHARD: ${{ steps.plan.outputs.single_shard }}
  hosted-check:
    if: ${{ needs.hosted-plan.outputs.matrix != '[]' }}
    needs: hosted-plan
    name: forge-hosted-${{ matrix.shard }}
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    # Shards are planned for 3-8 min of tests; project checks may be longer, never 6 h.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.hosted-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      # Key from the pinned control lockfile only (scripts/control-deps-key.mjs; any CI computes it).
      - id: deps-key
        run: echo "key=$(node scripts/control-deps-key.mjs)" >> "$GITHUB_OUTPUT"
        working-directory: control
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: deps
        with:
          path: |
            control/node_modules
            ~/.npm
          key: ${{ steps.deps-key.outputs.key }}
      # A miss retains the cold install; dist comes from this run's pinned control commit.
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
        working-directory: control
      - uses: actions/download-artifact@v4
        with:
          name: forge-candidate
          path: ${{ runner.temp }}
      - run: |
          tar -xf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/control-dist.tar" -C control
      - run: node control/scripts/hosted-actions-job.mjs run
        env:
          FORGE_CONVEX_SITE: ${{ inputs.deployment }}
          FORGE_PROJECT_ID: ${{ inputs.projectId }}
          FORGE_RUN_ID: ${{ inputs.runId }}
          FORGE_CANDIDATE: ${{ runner.temp }}/candidate
          FORGE_ACTIONS_SHARD: ${{ matrix.shard }}

  hosted-pack:
    if: ${{ needs.hosted-plan.outputs.pack_refresh == 'true' }}
    needs: hosted-plan
    name: Refresh optional Forge source pack
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      # Key from the pinned control lockfile only (scripts/control-deps-key.mjs; any CI computes it).
      - id: deps-key
        run: echo "key=$(node scripts/control-deps-key.mjs)" >> "$GITHUB_OUTPUT"
        working-directory: control
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: deps
        with:
          path: |
            control/node_modules
            ~/.npm
          key: ${{ steps.deps-key.outputs.key }}
      # A miss retains the cold install; dist comes from this run's pinned control commit.
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
        working-directory: control
      - uses: actions/download-artifact@v4
        with:
          name: forge-candidate
          path: ${{ runner.temp }}
      - run: |
          tar -xf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/control-dist.tar" -C control
      - run: node control/scripts/hosted-actions-job.mjs pack
        env:
          FORGE_CONVEX_SITE: ${{ inputs.deployment }}
          FORGE_PROJECT_ID: ${{ inputs.projectId }}
          FORGE_RUN_ID: ${{ inputs.runId }}
          FORGE_CANDIDATE: ${{ runner.temp }}/candidate
