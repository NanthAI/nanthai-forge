name: Forge check
run-name: forge-check/${{ inputs.runId }}
on:
  workflow_dispatch:
    inputs:
      runId:
        required: true
        type: string
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  shard:
    if: ${{ inputs.plan != '[]' }}
    name: forge-shard-${{ matrix.shard }}
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.plan) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/forge-check.mjs
        env:
          FORGE_ACTIONS_PLAN: .github/forge-check-plan.json
          FORGE_ACTIONS_SHARD: ${{ matrix.shard }}
  static:
    name: forge-static
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/forge-check.mjs
        env:
          FORGE_ACTIONS_PLAN: .github/forge-check-plan.json
          FORGE_ACTIONS_SHARD: static
