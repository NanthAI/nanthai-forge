name: Deploy dev web
run-name: Deploy dev web ${{ inputs.sequence || github.event_name }}

# Starts from Forge main landings via workflow_dispatch (Item 8b6efb50), not from the GitHub mirror
# push. The dev site (Cloudflare Worker nanthai-forge-dev, docs/development.md#web-site) deploys
# only when what it serves changed, at most once per 5-minute window (scripts/site-deploy-plan.mjs).
# Forge schedules one trailing flush when a landing arrives inside the 5-minute window (zero idle cost);
# the 3-hour schedule run stays only as disaster catch-up.
on:
  workflow_dispatch:
    inputs:
      state:
        description: Forge State that triggered the deploy (empty deploys Forge main's newest)
        required: false
        type: string
      sequence:
        description: Main sequence number Forge reported (shown only; the server decides)
        required: false
        type: string
  schedule:
    - cron: '7 */3 * * *'

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer main replaces a queued one, never interrupts a running one.
concurrency:
  group: web-deploy-nanthai-forge-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.FORGE_RELEASE_PROJECT != ''
    runs-on: ubuntu-latest
    # The Cloudflare token lives only in this environment; it deploys from main alone, so forks and PRs never see it.
    environment: cloudflare-dev
    timeout-minutes: 15
    env:
      SITE_URL: https://dev.forge.nanthai.tech
      FORGE_CONVEX_SITE: ${{ vars.VITE_CONVEX_SITE_URL }}
      FORGE_PROJECT_ID: ${{ vars.FORGE_RELEASE_PROJECT }}
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Plan the deploy
        id: plan
        # Read-only query against Forge main and the live site's build record; needs no dependencies.
        # Scheduled runs also count src/ and scripts/, which the generated references read through imports.
        run: node scripts/forge-deploy-ci.mjs plan --target web --site "$SITE_URL" ${{ github.event_name == 'schedule' && '--deep' || '' }}
      - name: Check out Forge main State
        if: steps.plan.outputs.build == 'true'
        env:
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
        run: node scripts/forge-deploy-ci.mjs checkout --target web --state "$DEPLOY_HEAD" --sequence "$DEPLOY_SEQUENCE" --dir .
      - if: steps.plan.outputs.build == 'true'
        run: npm ci --ignore-scripts
      - if: steps.plan.outputs.build == 'true'
        run: node scripts/prepare-convex-api.mjs
      - name: Build the web app
        if: steps.plan.outputs.build == 'true'
        run: npm run build:web
        env:
          # Public build-time config; the deploy below uploads this build as is.
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
          VITE_FORGE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_FORGE_POSTHOG_PROJECT_TOKEN }}
          VITE_FORGE_POSTHOG_REGION: ${{ vars.VITE_FORGE_POSTHOG_REGION }}
          VITE_FORGE_DEMO_REPOSITORY: thevarsek/nanthai-edge-oss
      - name: Guard the browser bundle against Node-only code
        if: steps.plan.outputs.build == 'true'
        run: node --test tests/web-bundle-node-free.test.mjs
      - name: Smoke-load the built Hosted chunk and check the build config is baked in
        if: steps.plan.outputs.build == 'true'
        # Fails on a module-evaluation error, or on a build that would show "Forge backend is not configured".
        run: node scripts/web-smoke-load.mjs hosted-web-dist VITE_CONVEX_URL
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - name: Build the site
        if: steps.plan.outputs.build == 'true'
        env:
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
        run: node scripts/build-site.mjs site-output --commit "$(git rev-parse HEAD)" --state "$DEPLOY_HEAD" --sequence "$DEPLOY_SEQUENCE"
      - name: Compare with the live site
        id: compare
        if: steps.plan.outputs.build == 'true'
        run: node scripts/site-deploy-plan.mjs compare "$SITE_URL" site-output
      - if: steps.compare.outputs.deploy == 'true'
        # The Cloudflare CLI is pinned by its own lockfile, so only this job downloads it.
        run: npm ci --ignore-scripts --prefix site/deploy
      - name: Deploy to the dev site
        id: upload
        if: steps.compare.outputs.deploy == 'true'
        working-directory: site-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
        # A block scalar: in a plain YAML scalar " #" starts a comment and cuts the command at the quote.
        run: |
          ../site/deploy/node_modules/.bin/cf deploy --prebuilt --no-provision --message "main #$DEPLOY_SEQUENCE $DEPLOY_HEAD"
      - name: Post-deploy smoke
        id: smoke
        if: steps.plan.outputs.build == 'true' && ((steps.compare.outputs.deploy == 'true' && steps.upload.outcome == 'success') || (steps.compare.outcome == 'success' && steps.compare.outputs.deploy != 'true'))
        env:
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          COMPARE_DEPLOY: ${{ steps.compare.outputs.deploy }}
        run: |
          if [ "$COMPARE_DEPLOY" = "true" ]; then
            node scripts/forge-deploy-ci.mjs smoke --site "$SITE_URL" --state "$DEPLOY_HEAD" --out "$RUNNER_TEMP/web-smoke.json" --no-fail
          else
            node scripts/forge-deploy-ci.mjs smoke --site "$SITE_URL" --out "$RUNNER_TEMP/web-smoke.json" --no-fail
          fi
      - name: Report deploy outcome to Forge
        if: always() && (steps.plan.outputs.build == 'true' || steps.plan.outputs.skipped_unchanged == 'true') && steps.plan.outputs.head != ''
        env:
          PLAN_BUILD: ${{ steps.plan.outputs.build }}
          PLAN_SKIPPED_UNCHANGED: ${{ steps.plan.outputs.skipped_unchanged }}
          DEPLOY_HEAD: ${{ steps.plan.outputs.head }}
          DEPLOY_SEQUENCE: ${{ steps.plan.outputs.sequence }}
          LIVE_HEAD: ${{ steps.plan.outputs.live_head }}
          LIVE_SEQUENCE: ${{ steps.plan.outputs.live_sequence }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          COMPARE_DEPLOY: ${{ steps.compare.outputs.deploy }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SMOKE_OK: ${{ steps.smoke.outputs.smoke_ok }}
          SMOKE_SUMMARY: ${{ steps.smoke.outputs.smoke_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status="failed"
          summary="Dev web deploy failed before post-deploy smoke completed."
          unchanged=""
          if [ "$PLAN_BUILD" != "true" ] && [ "$PLAN_SKIPPED_UNCHANGED" = "true" ]; then
            status="succeeded"
            summary=""
            unchanged="--unchanged"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            if [ "$SMOKE_OK" = "true" ]; then
              status="succeeded"
              summary=""
            else
              status="smoke-failed"
              summary="${SMOKE_SUMMARY:-Post-deploy smoke did not pass.}"
            fi
          elif [ "$COMPARE_OUTCOME" = "success" ] && [ "$COMPARE_DEPLOY" != "true" ]; then
            if [ "$SMOKE_OK" = "true" ]; then
              status="succeeded"
              summary=""
              unchanged="--unchanged"
            else
              status="smoke-failed"
              summary="${SMOKE_SUMMARY:-Post-deploy smoke did not pass.}"
            fi
          fi
          node scripts/forge-deploy-ci.mjs report \
            --target web \
            --state "$DEPLOY_HEAD" \
            --sequence "$DEPLOY_SEQUENCE" \
            --status "$status" \
            --url "$RUN_URL" \
            ${unchanged:+$unchanged} \
            ${LIVE_HEAD:+--live-state "$LIVE_HEAD"} \
            ${LIVE_SEQUENCE:+--live-sequence "$LIVE_SEQUENCE"} \
            ${summary:+--summary "$summary"} \
            --smoke-file "$RUNNER_TEMP/web-smoke.json"
      - name: Fail job when post-deploy smoke failed
        if: steps.plan.outputs.build == 'true' && ((steps.compare.outputs.deploy == 'true' && steps.upload.outcome == 'success') || (steps.compare.outcome == 'success' && steps.compare.outputs.deploy != 'true')) && steps.smoke.outputs.smoke_ok != 'true'
        env:
          SMOKE_SUMMARY: ${{ steps.smoke.outputs.smoke_summary }}
        run: |
          echo "::error::Post-deploy smoke failed: $SMOKE_SUMMARY"
          exit 1
